# The upstream Omarchy defaults also serve physical x86_64 systems. QEMU's
# generic AArch64 virt kernel has neither x86 microcode nor Thunderbolt, so
# remove those physical-machine requests after all upstream drop-ins load.
_omarchy_aarch64_virt_modules=()
for _omarchy_aarch64_virt_module in "${MODULES[@]}"; do
  [[ $_omarchy_aarch64_virt_module == thunderbolt ]] ||
    _omarchy_aarch64_virt_modules+=("$_omarchy_aarch64_virt_module")
done
MODULES=("${_omarchy_aarch64_virt_modules[@]}")

_omarchy_aarch64_virt_hooks=()
for _omarchy_aarch64_virt_hook in "${HOOKS[@]}"; do
  [[ $_omarchy_aarch64_virt_hook == microcode ]] ||
    _omarchy_aarch64_virt_hooks+=("$_omarchy_aarch64_virt_hook")
done
HOOKS=("${_omarchy_aarch64_virt_hooks[@]}")

unset _omarchy_aarch64_virt_modules _omarchy_aarch64_virt_module
unset _omarchy_aarch64_virt_hooks _omarchy_aarch64_virt_hook
